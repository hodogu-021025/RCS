# 로컬 배포용 compose. 운영과 같은 이미지(frontend/Dockerfile → nginx)를 이 PC 에서 빌드해 띄운다.
#   docker compose up -d --build                  →  http://localhost:8080
#   docker compose --profile tunnel up -d         →  + 인터넷 주소(https://○○○.trycloudflare.com)로도 공개
#   docker compose logs tunnel | grep trycloudflare   (공개 주소 확인 — 터널을 다시 켤 때마다 바뀐다)
#   docker compose --profile tunnel down          (터널까지 모두 중지)
# 개발할 때는 Vite 개발 서버(npm --prefix frontend run dev, :5173)를 쓰고, 이건 빌드 결과물을 확인할 때 쓴다.
name: rcs

services:
  chatbot:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: rcs-chatbot:latest
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # API 서버 (server/): 계정·주문·예약·매장 설정을 SQLite 에 저장하고, 회원가입 이메일 인증을 보낸다.
  # 바깥에 포트를 열지 않고, chatbot 의 nginx 가 /api/ 를 여기로 넘긴다.
  # Resend 키·관리자 계정은 저장소 루트의 .env 에서 읽는다 (.env.example 참고). 데이터는 saylo-data 볼륨에 남는다
  api:
    build: ./server
    image: rcs-api:latest
    env_file:
      - path: .env
        required: false
    volumes:
      - saylo-data:/data
    restart: unless-stopped

  # Cloudflare 임시 터널(계정 불필요). 주소를 아는 누구나 접속할 수 있으니 필요할 때만 켠다
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://chatbot:80
    depends_on:
      - chatbot
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  saylo-data:

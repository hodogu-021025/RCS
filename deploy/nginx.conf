# 챗봇 컨테이너(frontend/Dockerfile → nginx)의 유일한 server 블록. 정적 SPA 만 서빙한다 (백엔드 없음).
# HTTPS 는 앞단 프록시에서 종료한다.
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 가 파일명에 해시를 붙이므로 /assets/ 는 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하지 않아야 배포 직후 새 해시의 자산을 바로 받는다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

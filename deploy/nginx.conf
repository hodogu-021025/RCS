# 챗봇 컨테이너(frontend/Dockerfile → nginx)의 유일한 server 블록. 정적 SPA 를 서빙하고, /api/ 는 API 서버(server/)로 넘긴다.
# HTTPS 는 앞단 프록시에서 종료한다.
server {
    listen 80;
    server_name _;

    # 이메일 인증 API. 주소를 변수로 두면 요청 때 이름을 찾으므로, API 컨테이너가 늦게 떠도 nginx 는 먼저 뜬다
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api http://api:3001;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
        client_max_body_size 4k;
    }

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 가 파일명에 해시를 붙이므로 /assets/ 는 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하지 않아야 배포 직후 새 해시의 자산을 바로 받는다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
